<html>
    <head>
        <title>Gatti casuali</title>
        <style>
            .centrato{
                text-align: center;
            }
            #gatto-casuale{
                height: 560px;
            }
            #bottone-ricarica{
                font-size: 24px;
                background-color: cyan;
                padding: 6px; 
                border-radius: 50%;
            }
            #bottone-ricarica:hover{
                background-color: burlywood;
            }
            #gatti-salvati{
                display: flex;
                justify-content : space-around;
                flex-wrap: wrap;
            }
            #gatti-salvati img{
                height: 200px;
                margin : 10px;
            }

        </style>
    </head>

    <body>
        <div class="centrato">
            <button id ="bottone-ricarica">Ricarica gatto</button>
            <button id ="bottone-salva">salva</button></br></br>
            
            <img id="gatto-casuale" src="" alt="Gatto casuale">

            <div id="gatti-salvati"></div>
                
        </div>
        

        <script>
            const immagine = document.getElementById("gatto-casuale");
            const button = document.getElementById("bottone-ricarica");
            const bottoneSalva = document.getElementById("bottone-salva");
            const gattoSalvati = document.getElementById("gatti-salvati");

            let arrayGatti = [];






            async function getRandomCat(){
                const url = "https://cataas.com/cat?json=true";
                try{
                    const response = await fetch(url);

                    if(response.ok){
                        const cat = await response.json();
                        
                        immagine.src = cat.url;
                    }
                }catch(e){
                    console.log(e.message);
                }
                 
            }

            function renderizzaGatti(){
                gattoSalvati.innerHTML = ""; //puliamo il div prima di ricaricarlo
                for(let i=0; i<arrayGatti.length; i++){
                    const nuovoGatto = document.createElement("img");
                    nuovoGatto.src = arrayGatti[i];
                    gattoSalvati.appendChild(nuovoGatto);
                }

            }

            button.addEventListener("click", getRandomCat);


            bottoneSalva.addEventListener("click", () =>{
                arrayGatti.push(immagine.src);
                renderizzaGatti();


                const nuovoGatto = document.createElement("img");
                gattoSalvati.appendChild(nuovoGatto);
            });
            
            
        </script>
    </body>
</html>
